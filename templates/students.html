{% extends "base.html" %}

{% block title %}
Students
{% endblock %}

{% block content %}

<h1>Students</h1>

<form action="/students" method="GET">

    <input type="text" id="search-input" name="search" placeholder="Search student">

    <button type="submit">Search</button>

</form>

<p id="search-feedback"></p>

<br>

<a href="/students/add">
    Add Student
</a>

<br><br>

<div class="students-container">

    {% for student in students %}

    <div class="student-card">

        <h2>{{ student.name }}</h2>

        <p><strong>ID:</strong> {{ student.id }}</p>

        <p><strong>Department:</strong> {{ student.department }}</p>

        <p><strong>Email:</strong> {{ student.email }}</p>

        <div class="student-actions">

            <form action="/students/edit/{{ student.id }}" method="GET">
                <button type="submit" class="edit-button">Edit</button>
            </form>

            <form action="/students/delete/{{ student.id }}" method="POST" onsubmit="return confirmDelete()">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="delete-button">Delete</button>
            </form>

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
